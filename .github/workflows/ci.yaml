name: CI

on:
  push:
  #   branches: [main]
  # pull_request:

env:
  RUFF_VERSION: "0.15"
  MYPY_VERSION: "1.18"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Установка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Тесты
        run: pytest --cov=src

  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Кеш ruff
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ruff-${{ runner.os }}-${{ env.RUFF_VERSION }}

      - name: Установка ruff
        run: pip install "ruff~=${{ env.RUFF_VERSION }}.0"

      - name: Форматирование (только проверка)
        run: ruff format --check .

      - name: Линтер
        run: ruff check .

  typecheck:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей проекта
        run: pip install -e .

      - name: Установка mypy
        run: pip install "mypy~=${{ env.MYPY_VERSION }}.0"

      - name: Проверка типов
        run: mypy .
